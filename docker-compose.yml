services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: evently
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evently}
      POSTGRES_DB: evently
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evently -d evently"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Database=evently;Username=evently;Password=${POSTGRES_PASSWORD:-evently}
      DataProtection__Keys: /keys
      GoogleMaps__ApiKey: ${GOOGLE_MAPS_API_KEY:-}
      GoogleMaps__BrowserKey: ${GOOGLE_MAPS_BROWSER_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - keys:/keys

volumes:
  pgdata:
  keys:
